<style>
/* Layout: toolbar, then a pan-and-zoom sheet of area panels; inside each panel parents sit left, children right */
:root {

  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1013; --sheet: #0e161a; --panel: #121c21; --card: #172329; --fg: #e2ecef; --muted: #91a6ad;

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; }

.bar h1 { font-family: var(--mono); font-size: 16px; margin: 0; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
.legend svg { vertical-align: middle; color: var(--fg); }
.tools { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.tools input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--fg); width: 170px; }
.tools button { font: 600 13px var(--mono); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--fg); cursor: pointer; }

#viewport { flex: 1; overflow: hidden; position: relative; background: var(--sheet); cursor: grab; touch-action: none; }
#viewport.dragging { cursor: grabbing; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 40px; display: flex; flex-direction: column; gap: 44px; }
#lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }
.arow { display: flex; gap: 44px; align-items: flex-start; }
.area { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px 22px;
  display: flex; flex-direction: column; gap: 16px; }
.area header { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--hue); padding-bottom: 8px; }
.area h2 { margin: 0; font: 700 15px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--hue); }
.area header span { color: var(--muted); font-size: 12px; }
.layers { display: flex; gap: 96px; align-items: flex-start; }
.layer { display: flex; flex-direction: column; gap: 18px; }
.card { width: 240px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .06); position: relative; z-index: 1; transition: opacity .15s; }
.card .th { font: 700 13px var(--mono); padding: 7px 10px; color: #fff; background: var(--hue); }
.card.stub { background: var(--stub); border: 1.5px dashed var(--rel); box-shadow: none; width: 200px; }
.card.stub .th { background: none; color: var(--fg); display: flex; justify-content: space-between; gap: 6px; }
.card.stub .th small { font: 500 10px var(--sans); color: var(--muted); align-self: center; white-space: nowrap; }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px; padding: 3px 10px;
  font: 12px var(--mono); border-top: 1px solid var(--line); align-items: center; }
.row.newgroup { border-top: 1.5px solid var(--rel); }
.row .k { font-size: 9px; font-weight: 700; }
.row .k.pk { color: var(--pk); }
.row .k.fk { color: var(--accent); }
.row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.pkrow .n { font-weight: 600; }
.row .t { color: var(--muted); font-size: 11px; white-space: nowrap; }
.row .ref { color: var(--accent); font-size: 10.5px; font-weight: 600; }
#lines path { fill: none; stroke: var(--rel); stroke-width: 1.5; transition: opacity .15s; }
#lines path.hi { stroke: var(--accent); stroke-width: 2.4; }
.focus .card:not(.hi) { opacity: .3; }
.focus #lines path:not(.hi) { opacity: .1; }
.card.hi { outline: 2px solid var(--accent); }
.hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; pointer-events: none; }
.png #viewport { overflow: visible; cursor: default; }
.png #stage { position: relative; }
.png .tools, .png .hint { display: none; }
@media (prefers-reduced-motion: reduce) { .card, #lines path { transition: none; } }
</style>

function makeCard(area, item) {
  const t = DATA.tables[item.name];
  const card = document.createElement("div");
  card.className = "card" + (item.stub ? " stub" : "");
  card.style.setProperty("--hue", areaHue[item.stub ? DATA.home[item.name] : area.title]);
  card.innerHTML = item.stub
    ? `<div class="th">${item.name}<small>in ${DATA.home[item.name]}</small></div>`
    : `<div class="th">${item.name}</div>`;
  area.rows[item.name] = {};
  const cols = item.stub ? t.columns.filter(c => item.cols.includes(c.name)) : t.columns;
  let lastGroup = null;
  for (const c of cols) {
    const fk = t.fks.find(f => f.from === c.name);
    const r = document.createElement("div");
    r.className = "row" + (c.pk ? " pkrow" : "") + (lastGroup && c.group !== lastGroup ? " newgroup" : "");
    lastGroup = c.group;
    const key = c.pk && c.fk ? "PK FK" : c.pk ? "PK" : c.fk ? "FK" : "";
    const right = !item.stub && fk && LOOK.has(fk.table)
      ? `<span class="ref">→ ${fk.table}</span>` : `<span class="t">${c.type}${c.nn ? "" : "?"}</span>`;

// ---------- lines (only inside each area) ----------
const paths = [];
function box(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { l: r.left - s.left, r: r.right - s.left, y: (r.top + r.bottom) / 2 - s.top };
}

const crow = (x, y, d) => `M${x} ${y - 7}L${x + d * 12} ${y}L${x} ${y + 7}`;

function drawLines() {
  stage.style.transform = "none";
  svg.innerHTML = "";
  svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
  paths.length = 0;
  for (const area of areas) {
    for (const name of Object.keys(area.cards)) {
      if (area.stubs.has(name)) continue;
      const t = DATA.tables[name];
      t.fks.forEach((fk, i) => {
        if (LOOK.has(fk.table) || !area.cards[fk.table]) return;
        const a = box(area.rows[name][fk.from]), b = box(area.rows[fk.table][fk.to]);
        let ax, bx, da, db, d;
        if (fk.table === name) {                                   // self reference
          ax = a.r; bx = b.r; da = db = 1;
          const out = 34 + i * 8;
          d = `M${ax} ${a.y}C${ax + out} ${a.y} ${bx + out} ${b.y} ${bx} ${b.y}`;
        } else {
          const ca = box(area.cards[name]), cb = box(area.cards[fk.table]);
          if (cb.r <= ca.l) { ax = a.l; bx = b.r; da = -1; db = 1; }
          else if (cb.l >= ca.r) { ax = a.r; bx = b.l; da = 1; db = -1; }
          else { ax = a.r; bx = b.r; da = db = 1; }
          const k = da === db ? 50 : Math.max(36, Math.abs(bx - ax) * 0.5);
          d = `M${ax} ${a.y}C${ax + da * k} ${a.y} ${bx + db * k} ${b.y} ${bx} ${b.y}`;
        }
        const col = t.columns.find(c => c.name === fk.from);
        d += bar(bx, b.y, db, 8) + (col && col.nn ? bar(bx, b.y, db, 13) : ring(bx, b.y, db, 17));
        d += fk.one ? bar(ax, a.y, da, 9) + ring(ax, a.y, da, 17) : crow(ax, a.y, da) + ring(ax, a.y, da, 17);
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        svg.appendChild(p);
        paths.push({ el: p, area, a: name, b: fk.table });

    }
  }
  applyView();
}

// ---------- highlight ----------
let pinned = null;
function highlight(target) {
  stage.classList.toggle("focus", !!target);
  stage.querySelectorAll(".card.hi").forEach(c => c.classList.remove("hi"));
  paths.forEach(p => p.el.classList.remove("hi"));
  if (!target) return;
  const { area, name } = target;
  area.cards[name].classList.add("hi");
  for (const p of paths) if (p.area === area && (p.a === name || p.b === name)) {
    p.el.classList.add("hi"); area.cards[p.a].classList.add("hi"); area.cards[p.b].classList.add("hi");
    svg.appendChild(p.el);
  }
}
for (const area of areas) for (const [name, card] of Object.entries(area.cards)) {
  const target = { area, name };
  card.addEventListener("mouseenter", () => { if (!pinned) highlight(target); });
  card.addEventListener("mouseleave", () => { if (!pinned) highlight(null); });
  card.addEventListener("click", e => {
    pinned = pinned && pinned.area === area && pinned.name === name ? null : target;
    highlight(pinned); e.stopPropagation();
  });
}

function zoomAt(f, cx, cy) {
  const s = Math.min(2.5, Math.max(0.1, view.s * f));
  view.x = cx - (cx - view.x) * (s / view.s); view.y = cy - (cy - view.y) * (s / view.s); view.s = s; applyView();
}
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
let drag = null;
viewport.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; viewport.classList.add("dragging"); });
window.addEventListener("pointermove", e => {
  if (!drag) return;
  view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
  applyView();
});
window.addEventListener("pointerup", () => { viewport.classList.remove("dragging"); setTimeout(() => drag = null); });
viewport.addEventListener("click", () => { if (drag && drag.moved) return; pinned = null; highlight(null); });
document.getElementById("zin").onclick = () => zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
document.getElementById("zout").onclick = () => zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2);
document.getElementById("fit").onclick = fit;
document.getElementById("find").addEventListener("change", e => {
  const name = e.target.value.trim();
  const area = areas.find(a => a.title === DATA.home[name]);
  if (!area) return;
  pinned = { area, name }; highlight(pinned);
  stage.style.transform = "none";
  const b = box(area.cards[name]);
  view.s = Math.max(view.s, 0.9);
  view.x = viewport.clientWidth / 2 - (b.l + 120) * view.s;
  view.y = 80 - (b.y - 60) * view.s;
  applyView();
});

function start() { drawLines(); if (!PNG) fit(); }
(document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
window.addEventListener("resize", () => { if (!PNG) fit(); });
</script>
